name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v0.6.0
        with:
          root: .

      - name: Check JavaScript syntax
        run: |
          node --check js/main.js
          node --check js/components.js
          node --check js/data.js

      - name: Check required files
        run: |
          test -f index.html
          test -f Dockerfile
          test -f terraform/main.tf
          test -f terraform/provider.tf
          echo "Required files exist"

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - validate
      - security
      - terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -t amy-fitness:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker images
          docker inspect amy-fitness:${{ github.sha }} > /dev/null
          echo "Docker image built successfully"

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: amy-fitness:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true